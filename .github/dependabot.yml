# One Monday PR for routine updates across Python and GitHub Actions.
# Native uv support keeps pyproject.toml and uv.lock in sync.
# Each ecosystem retains its cooldown and a separate security-update group.
version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

updates:
  - package-ecosystem: "uv"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      security-updates:
        applies-to: "security-updates"
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      security-updates:
        applies-to: "security-updates"
        patterns: ["*"]
