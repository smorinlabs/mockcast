# One Monday PR for routine updates across Python and GitHub Actions.
# Native uv support keeps pyproject.toml and uv.lock in sync.
# Each ecosystem retains its cooldown and a separate security-update group.
#
# Do not set `open-pull-requests-limit` on an entry that joins a
# multi-ecosystem group. With that key present, GitHub kept running the
# previous per-ecosystem config (old group names,
# `multi-ecosystem-update: false` in the updater job definition) and opened
# separate PRs. One weekly PR needs no limit.
version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

updates:
  - package-ecosystem: "uv"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    cooldown:
      default-days: 5
    labels: ["dependencies"]
    groups:
      security-updates:
        applies-to: "security-updates"
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    cooldown:
      default-days: 5
    labels: ["dependencies"]
    groups:
      security-updates:
        applies-to: "security-updates"
        patterns: ["*"]
